# Publishes the package to npm when a version tag (for example 0.1.1) is pushed.
# n8n only verifies community nodes published from GitHub Actions with an npm
# provenance statement, which this workflow produces.
#
# Publishing uses npm Trusted Publishing (OIDC): on npmjs.com, package settings,
# Trusted Publishers, add GitHub Actions with owner "noderings", repository
# "n8n-nodes-noderings" and workflow "publish.yml". No long-lived npm token.
name: publish

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance and Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.5.1 or later
        run: npm install -g npm@latest
      - run: npm ci
      # Tests import compiled files under dist/; CI also builds before test.
      - run: npm run build
      - run: npm test
      # In GitHub Actions, `n8n-node release` lints, builds and runs
      # `npm publish` with a provenance statement. Trusted publishing
      # exchanges the GitHub OIDC token itself; drop the token-based
      # .npmrc that setup-node wrote so an empty NODE_AUTH_TOKEN cannot
      # break OIDC (same approach as noderings/pulumi-noderings).
      - name: Publish with provenance
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG}"
          unset NODE_AUTH_TOKEN
          npm run release

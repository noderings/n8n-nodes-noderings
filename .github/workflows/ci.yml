name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, build and test
    # Pushes to main run on the org runner; pull requests and everything else stay GitHub-hosted.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: No runtime dependencies (n8n verification rule)
        run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length) { console.error('dependencies must be empty'); process.exit(1) }"
      - name: Package contents
        run: npm pack --dry-run 2>&1 | tee /dev/stderr | grep -q 'dist/nodes/NodeRingsTrigger/NodeRingsTrigger.node.js'
